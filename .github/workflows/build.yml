name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Simple-Commons
        uses: actions/checkout@v7
        with:
          repository: SimpleMobileTools/Simple-Commons
          ref: 9e60e2479050b9dcc9d8fccdc240398a5f993184
          path: Simple-Commons
          persist-credentials: false

      - name: Patch Simple-Commons for CI
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("Simple-Commons/gradle/libs.versions.toml")
          text = path.read_text()
          replacements = [
              ('gradlePlugins-agp = "8.1.2"', 'gradlePlugins-agp = "8.13.2"'),
              # JitPack never built duolingo/rtl-viewpager@940f12724f. Fossify uses this fork.
              ('rtlViewpager = "940f12724f"', 'rtlViewpager = "2.0.2"'),
              (
                  'rtl-viewpager = { module = "com.github.duolingo:rtl-viewpager", version.ref = "rtlViewpager" }',
                  'rtl-viewpager = { module = "com.github.naveensingh:rtl-viewpager", version.ref = "rtlViewpager" }',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"patch failed: {old!r} not found")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python3 scripts/patch_commons.py
          grep -E 'gradlePlugins-agp|rtlViewpager|rtl-viewpager' Simple-Commons/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is required so this APK is release-signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          printf '%s\n' "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" "storeFile=keystore.jks" "storePassword=$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build FOSS release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace --no-daemon

      - name: Name APK Simple-Gallery_<version>
        id: apk
        run: |
          VERSION=$(grep -oP 'app-version-versionName = "\K[^"]+' gradle/libs.versions.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          apk=$(find app/build/outputs/apk/foss/release -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" "dist/Simple-Gallery_${VERSION}.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Gallery_${{ steps.apk.outputs.version }}
          path: dist/Simple-Gallery_*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Simple-Gallery_*.apk
          generate_release_notes: true
          body: |
            Release-signed FOSS APK (`Simple-Gallery_<version>.apk`) for applicationId tomato.simple.gallery.
            It can sit next to Play Store Simple Gallery Pro. Launcher name is Gallery.

            ## New in 6.29

            1. **JPEG optimize** — Native jpegoptim from the grid (batch) or the viewer. Lossless Huffman, or lossy max quality (50–100, default 85). Metadata and motion-photo tails stay; files are replaced only if they get smaller.
            2. **Motion photos** — Play Google Motion Photos, Samsung Live Photos, and Micro Videos in the viewer. Save the embedded clip as an MP4.
            3. **OpenGL panorama viewer** — Open 360° panoramas and photospheres with touch, pinch, and optional gyroscope (replaces the removed Google VR Cardboard widgets).
            4. **Strip metadata** — Remove GPS, or all EXIF, from photos in the viewer and from a multi-select in the grid.
            5. **Stacks** — RAW+JPEG pairs, bursts, and edited copies collapse to one grid cover, with a strip in the viewer.
            6. **Editor** — Stack crop, draw, filters, adjust, and text in one session. Tone sliders, font picker, draggable text and emoji stickers, overwrite original. Tap 4:3 or 16:9 again for 3:4 or 9:16. Save is the top-bar checkmark (toolbar sits below the status bar).
            7. **Folder tree view** — Nested albums indent in a list. Unchecking restores the previous grid/list.
            8. **Formats** — AVIF and JPEG XL in the grid, viewer, and “open with”. Ultra HDR (Android 14+ gain maps) with a settings toggle.
            9. **In-app video player** — Speed, mute, long-press 2×, exact seek/loop. New installs default to the in-app player.
            10. **Other** — Hidden-folder include no longer leaks Android/data / Android/obb; edge-to-edge on Android 15/16; copy image to clipboard; sort folders by item count; confirm recycle-bin restore; keep screen on for fullscreen photos; reverse landscape; no silent auto-save of gesture rotation; no donation prompts; no “fake version” block on save.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
