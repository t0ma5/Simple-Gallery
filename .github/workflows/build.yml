name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Simple-Commons
        uses: actions/checkout@v7
        with:
          repository: SimpleMobileTools/Simple-Commons
          ref: 9e60e2479050b9dcc9d8fccdc240398a5f993184
          path: Simple-Commons
          persist-credentials: false

      - name: Patch Simple-Commons for CI
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("Simple-Commons/gradle/libs.versions.toml")
          text = path.read_text()
          replacements = [
              ('gradlePlugins-agp = "8.1.2"', 'gradlePlugins-agp = "8.6.0"'),
              # JitPack never built duolingo/rtl-viewpager@940f12724f. Fossify uses this fork.
              ('rtlViewpager = "940f12724f"', 'rtlViewpager = "2.0.2"'),
              (
                  'rtl-viewpager = { module = "com.github.duolingo:rtl-viewpager", version.ref = "rtlViewpager" }',
                  'rtl-viewpager = { module = "com.github.naveensingh:rtl-viewpager", version.ref = "rtlViewpager" }',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"patch failed: {old!r} not found")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          grep -E 'gradlePlugins-agp|rtlViewpager|rtl-viewpager' Simple-Commons/gradle/libs.versions.toml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is required so this APK is release-signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          printf '%s\n' "keyAlias=$KEY_ALIAS" "keyPassword=$KEY_PASSWORD" "storeFile=keystore.jks" "storePassword=$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build FOSS release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gallery-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/foss/release/*.apk
          generate_release_notes: true
          body: |
            Release-signed FOSS APK for applicationId tomato.simple.gallery.
            It can sit next to Play Store Simple Gallery Pro.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
